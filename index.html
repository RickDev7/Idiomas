<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#081220" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('dt_theme') || 'system';
          var r = t === 'light' || t === 'dark'
            ? t
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          if (r === 'light') document.documentElement.classList.add('light');
          document.documentElement.dataset.theme = r;
          document.documentElement.dataset.themePreference = t === 'dark' || t === 'light' || t === 'system' ? t : 'system';
          document.documentElement.style.colorScheme = r;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', r === 'light' ? '#F5F7FC' : '#081220');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Deutsch Turbo — seu professor particular de alemão por voz. Aprenda conversando." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deutsch Turbo" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <title>Deutsch Turbo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
